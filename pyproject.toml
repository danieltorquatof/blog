[project]
name = "blog"
version = "0.1.0"
description = "Daniel Torquato's personal blog, built with Quarto"
authors = [{ name = "Daniel Torquato", email = "dr.torquato180204@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "quarto-cli>=1.10.19",
]

[tool.uv]
package = false
