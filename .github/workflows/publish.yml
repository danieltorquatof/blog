name: Quarto Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so file modification times can be restored for sitemap <lastmod>
          fetch-depth: 0

      - name: Restore file modification times from Git history
        uses: chetan/git-restore-mtime-action@v2

      - name: Set environment variables
        run: echo "QUARTO_CHROMIUM_HEADLESS_MODE=new" >> $GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # Installs Python (from .python-version), the dependencies and Quarto (quarto-cli, dev group)
      - name: Install dependencies
        run: uv sync --locked

      - name: Ensure uv virtual environment is used
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Publish site
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
