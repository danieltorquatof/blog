project:
  type: website

  output-dir: _site

  resources:
    - CNAME

  # Generates the social preview cards (og-image.png) before rendering
  pre-render: utils/og_images.py
  # Adds JSON-LD / og:url, cleans canonical URLs and writes the UUID short links
  post-render: utils/seo_postrender.py

lang: en

website:
  title: "Daniel Torquato"
  description: "Daniel Torquato's blog on software engineering, data science, artificial intelligence, DevOps and systems design."

  site-url: https://blog.danieltorquatof.spikeystudio.com/

  # Default social preview image (generated by utils/og_images.py)
  image: assets/images/og-image.png
  image-alt: "Daniel Torquato – Software Engineering, AI & Systems Design"

  open-graph:
    locale: en_US
  twitter-card:
    card-style: summary_large_image

  cookie-consent: false

  # Draft pages are not rendered at all (no empty pages answering 200)
  draft-mode: gone

  favicon: assets/icons/favicon.ico

  search:
    location: navbar
    type: overlay
    keyboard-shortcut: ["?", "H"]

  navbar:
    title: "DT's Blog"
    search: true

    left:
      - text: "Posts"
        href: posts/index.qmd
      - text: "Projects"
        href: projects/index.qmd
      - text: "Articles"
        href: articles/index.qmd
      - text: "Achievements"
        href: achievements/index.qmd
      - text: "About me"
        menu:
        - icon: file-person-fill
          text: "Resume"
          href: aboutMe/resume.qmd

    tools:
      - icon: linkedin
        text: LinkedIn
        href: https://www.linkedin.com/in/danieltorquatof/
        target: _blank
      - icon: github
        href: https://github.com/danieltorquatof
        target: _blank
      - icon: rss
        href: index.xml
        target: _blank

  page-footer:
    center: "Copyright © 2025–2026 - Spikey Studio"

format:
  html:
    theme:
      light: themes/light_theme.scss
      dark: themes/dark_theme.scss

    date-format: long

    page-layout: full

    toc: false

    canonical-url: true

    include-in-header:
      - utils/blank_alternate_formats_util.html

execute:
  echo: false
  freeze: auto
